# Direct boot from internal Flash, without MCUboot or an image header.
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_USE_DT_CODE_PARTITION=n
CONFIG_FLASH_LOAD_OFFSET=0
CONFIG_FLASH_LOAD_SIZE=0
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_GPIO=y
CONFIG_CAN=y
CONFIG_CAN_STM32H7_FDCAN=y
CONFIG_CAN_FD_MODE=n
CONFIG_CAN_ACCEPT_RTR=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="apollo:~$ "
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_THREAD_NAME=y
CONFIG_NUM_PREEMPT_PRIORITIES=32
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_I2C=y
CONFIG_I2C_STM32_TRANSFER_TIMEOUT_MSEC=100
# lwIP owns IP; no Zephyr IP/socket stack or physical MAC is enabled yet.
CONFIG_NETWORKING=n
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=n

# RGB565 framebuffer in external SDRAM, initialized before LTDC.
CONFIG_MEMC=y
CONFIG_DISPLAY=y
CONFIG_STM32_LTDC_RGB565=y
CONFIG_STM32_LTDC_FB_NUM=1
CONFIG_MEM_ATTR=y
CONFIG_ARM_MPU=y
